# See https://mypy.readthedocs.io/en/stable/existing_code.html
[mypy]
python_version = 3.10
files = opapywasm, tests

# Baseline hygiene. warn_unused_configs is intentionally off: the
# [mypy-wasmtime.*] / [mypy-yaml.*] overrides below are needed once those
# modules are imported (milestone C1+), but would flag as "unused" until then.
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
extra_checks = True
check_untyped_defs = True

# Strict-where-practical for the library itself.
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_no_return = True

# wasmtime ships type hints but they are loose in places; don't let its
# internals fail our build.
[mypy-wasmtime.*]
follow_imports = skip

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-_pytest.*]
ignore_missing_imports = True

# Tests exercise error paths and fixtures; relax the strictest checks there.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
